name: Compilar VelocimetroGPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VelocimetroGPS/**'
      - '.github/workflows/velocimetro-gps.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: VelocimetroGPS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | head -n 50
            exit 1
          fi
          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VelocimetroGPS-debug
          path: VelocimetroGPS/app/build/outputs/apk/debug/app-debug.apk
