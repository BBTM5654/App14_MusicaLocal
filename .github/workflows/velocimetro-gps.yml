name: Compilar VelocimetroGPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VelocimetroGPS/**'
      - '.github/workflows/velocimetro-gps.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: VelocimetroGPS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VelocimetroGPS-debug
          path: VelocimetroGPS/app/build/outputs/apk/debug/app-debug.apk
